name: Coverage (with doctests)
permissions:
  contents: read
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.11"
    - name: Generate coverage report
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mpl coverage docopt
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install scipy seaborn
        export MPL_IMGCOMP_TOLERANCE=20
        coverage run -m pytest --mpl --doctest-glob="probscale/*.py" --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@29386c70ef20e286228c72b668a06fd0e8399192 # v1
      with:
        # directory: ./coverage/reports/
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        path_to_write_report: ./codecov_report.gz
